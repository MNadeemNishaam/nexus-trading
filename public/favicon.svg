<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><rect width="240" height="240" rx="48" fill="#3d1222"/>

  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7bf"/>
      <stop offset=".35" stop-color="#d4b06a"/>
      <stop offset=".6" stop-color="#9c7637"/>
      <stop offset=".82" stop-color="#e3c98c"/>
      <stop offset="1" stop-color="#b48a45"/>
    </linearGradient>
    <mask id="fm" maskUnits="userSpaceOnUse">
      <rect width="240" height="240" fill="#fff"/>
      <polygon points="138,34 170,34 102,206 70,206" fill="#000"/>
    </mask>
  </defs>
  <g class="mono-fill" fill="url(#fg)">
    <!-- N stems -->
    <rect x="58" y="44" width="11" height="152"/>
    <rect x="44" y="194" width="38" height="6"/>
    <rect x="171" y="44" width="11" height="152"/>
    <rect x="158" y="40" width="38" height="6"/>
    <!-- N heavy diagonal, cut where the X passes over -->
    <g mask="url(#fm)">
      <polygon points="52,40 88,40 188,200 152,200"/>
    </g>
    <!-- X hairline (double rule), with serifs -->
    <polygon points="146,40 151,40 89,200 84,200"/>
    <polygon points="157,40 162,40 100,200 95,200"/>
    <rect x="136" y="34" width="36" height="6"/>
    <rect x="74" y="200" width="36" height="6"/>
  </g>
  
</svg>